<h1>Strona główna</h1>

{% if user.is_authenticated %}
  <p>Witaj, {{ user.username }} | <a href="{% url 'logout' %}">Wyloguj</a></p>

  <p>Wybierz pokój:</p>
  <ul>
    <li><a href="{% url 'converse' %}?room=HZsRsNcl">Pokój 1</a></li>
    <li><a href="{% url 'converse' %}?room=Xt4pQw8Z">Pokój 2</a></li>
    <li><a href="{% url 'converse' %}?room=Mn2LdF0K">Pokój 3</a></li>
  </ul>

  <h2>Wybierz kwotę do zapłaty:</h2>
  <div>
    <form action="" method="POST">
      {% csrf_token %}
      <input type="hidden" name="amount" value="50">
      <button type="submit">50 zł</button>
    </form>

    <form action="" method="POST">
      {% csrf_token %}
      <input type="hidden" name="amount" value="100">
      <button type="submit">100 zł</button>
    </form>

    <form action="" method="POST">
      {% csrf_token %}
      <input type="hidden" name="amount" value="150">
      <button type="submit">150 zł</button>
    </form>
  </div>

{% else %}
  <p><a href="{% url 'login' %}">Zaloguj się</a> lub <a href="{% url 'register' %}">Zarejestruj</a></p>
{% endif %}
